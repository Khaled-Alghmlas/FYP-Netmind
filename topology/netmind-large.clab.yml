name: netmind-large
topology:
  nodes:
    r1:
      kind: linux
      image: frrouting/frr:latest
      exec:
      - sysctl -w net.ipv4.ip_forward=1
      - ip addr add 10.10.1.1/30 dev eth1
      - ip route add 10.1.0.0/24 via 10.10.1.2 dev eth1
      - ip addr add 10.10.2.1/30 dev eth2
      - ip route add 10.2.0.0/24 via 10.10.2.2 dev eth2
      - ip addr add 10.10.3.1/30 dev eth3
      - ip route add 10.3.0.0/24 via 10.10.3.2 dev eth3
    fw-branch1:
      kind: linux
      image: netmind-firewall:latest
      exec:
      - sysctl -w net.ipv4.ip_forward=1
      - ip addr add 10.10.1.2/30 dev eth1
      - ip addr add 10.1.0.1/24 dev eth2
      - ip route add 10.0.0.0/8 via 10.10.1.1 dev eth1
    switch-branch1:
      kind: bridge
    host-khalid:
      kind: linux
      image: alpine:latest
      exec:
      - ip addr add 10.1.0.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.1.0.1 dev eth1
    host-khalil:
      kind: linux
      image: alpine:latest
      exec:
      - ip addr add 10.1.0.11/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.1.0.1 dev eth1
    host-turki:
      kind: linux
      image: alpine:latest
      exec:
      - ip addr add 10.1.0.12/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.1.0.1 dev eth1
    cam-khalid:
      kind: linux
      image: netmind-camera:latest
      exec:
      - ip addr add 10.1.0.50/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.1.0.1 dev eth1
    fw-branch2:
      kind: linux
      image: netmind-firewall:latest
      exec:
      - sysctl -w net.ipv4.ip_forward=1
      - ip addr add 10.10.2.2/30 dev eth1
      - ip addr add 10.2.0.1/24 dev eth2
      - ip route add 10.0.0.0/8 via 10.10.2.1 dev eth1
    hub-branch2:
      kind: bridge
    host-sara:
      kind: linux
      image: alpine:latest
      exec:
      - ip addr add 10.2.0.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.2.0.1 dev eth1
    host-omar:
      kind: linux
      image: alpine:latest
      exec:
      - ip addr add 10.2.0.11/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.2.0.1 dev eth1
    fw-branch3:
      kind: linux
      image: netmind-firewall:latest
      exec:
      - sysctl -w net.ipv4.ip_forward=1
      - ip addr add 10.10.3.2/30 dev eth1
      - ip addr add 10.3.0.1/24 dev eth2
      - ip route add 10.0.0.0/8 via 10.10.3.1 dev eth1
    switch-branch3:
      kind: bridge
    host-ahmed:
      kind: linux
      image: alpine:latest
      exec:
      - ip addr add 10.3.0.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.3.0.1 dev eth1
    host-fahad:
      kind: linux
      image: alpine:latest
      exec:
      - ip addr add 10.3.0.11/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.3.0.1 dev eth1
    host-noura:
      kind: linux
      image: alpine:latest
      exec:
      - ip addr add 10.3.0.12/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.3.0.1 dev eth1
    cam-ahmed:
      kind: linux
      image: netmind-camera:latest
      exec:
      - ip addr add 10.3.0.50/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.3.0.1 dev eth1
    cam-fahad:
      kind: linux
      image: netmind-camera:latest
      exec:
      - ip addr add 10.3.0.51/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.3.0.1 dev eth1
  links:
  - endpoints:
    - r1:eth1
    - fw-branch1:eth1
  - endpoints:
    - fw-branch1:eth2
    - switch-branch1:b1p1
  - endpoints:
    - switch-branch1:b1p2
    - host-khalid:eth1
  - endpoints:
    - switch-branch1:b1p3
    - host-khalil:eth1
  - endpoints:
    - switch-branch1:b1p4
    - host-turki:eth1
  - endpoints:
    - switch-branch1:b1p5
    - cam-khalid:eth1
  - endpoints:
    - r1:eth2
    - fw-branch2:eth1
  - endpoints:
    - fw-branch2:eth2
    - hub-branch2:b2p1
  - endpoints:
    - hub-branch2:b2p2
    - host-sara:eth1
  - endpoints:
    - hub-branch2:b2p3
    - host-omar:eth1
  - endpoints:
    - r1:eth3
    - fw-branch3:eth1
  - endpoints:
    - fw-branch3:eth2
    - switch-branch3:b3p1
  - endpoints:
    - switch-branch3:b3p2
    - host-ahmed:eth1
  - endpoints:
    - switch-branch3:b3p3
    - host-fahad:eth1
  - endpoints:
    - switch-branch3:b3p4
    - host-noura:eth1
  - endpoints:
    - switch-branch3:b3p5
    - cam-ahmed:eth1
  - endpoints:
    - switch-branch3:b3p6
    - cam-fahad:eth1
