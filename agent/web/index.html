<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>NetMind Chat</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; background: #0f1117; color: #eee; margin: 0; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 700px; height: 100vh; display: flex; flex-direction: column; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { margin: 10px 0; padding: 10px 14px; border-radius: 10px; max-width: 80%; line-height: 1.6; white-space: pre-wrap; }
  .user { background: #2563eb; margin-inline-start: auto; }
  .bot { background: #1f2430; margin-inline-end: auto; }
  #inputBar { display: flex; padding: 15px; gap: 10px; border-top: 1px solid #2a2f3a; }
  #inputBox { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #1f2430; color: #fff; font-size: 15px; }
  #sendBtn { padding: 12px 20px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-size: 15px; }
  #sendBtn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <div id="chat"></div>
  <div id="inputBar">
    <input id="inputBox" type="text" placeholder="اسأل عن أي جهاز بالشبكة..." />
    <button id="sendBtn">إرسال</button>
  </div>
</div>
<script>
const sessionId = crypto.randomUUID();
const chat = document.getElementById('chat');
const input = document.getElementById('inputBox');
const btn = document.getElementById('sendBtn');

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const message = input.value.trim();
  if (!message) return;
  addMsg(message, 'user');
  input.value = '';
  btn.disabled = true;
  addMsg('...', 'bot');
  const placeholder = chat.lastChild;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message })
    });
    const data = await res.json();
    placeholder.textContent = data.reply;
  } catch (e) {
    placeholder.textContent = 'صار خطأ بالاتصال بالسيرفر.';
  }
  btn.disabled = false;
}

btn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
