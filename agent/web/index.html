<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F2;
    --panel: #F0EBE3;
    --border: #E4DDD1;
    --text: #2B2622;
    --muted: #8A8178;
    --accent: #C96442;
    --accent-text: #FFFFFF;
    --input-bg: #FFFFFF;
    --code-bg: rgba(0,0,0,0.08);
  }
  :root[data-theme="dark"] {
    --bg: #1E1B18;
    --panel: #2A2622;
    --border: #3D3833;
    --text: #EDE8E0;
    --muted: #9A9088;
    --accent: #D97757;
    --accent-text: #FFFFFF;
    --input-bg: #2A2622;
    --code-bg: rgba(255,255,255,0.1);
  }
  body { transition: background-color 0.15s, color 0.15s; }
  * { box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  html[dir="rtl"] body { font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif; }

  #app { width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column; }

  #header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; border-bottom: 1px solid var(--border);
  }
  #wordmark { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  #langToggle {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1px solid var(--border); border-radius: 20px;
    padding: 6px 12px; cursor: pointer; color: var(--text); font-size: 13px;
    font-family: inherit;
  }
  #langToggle:hover { background: var(--panel); }
  #langToggle svg { width: 15px; height: 15px; }

  #headerControls { display: flex; align-items: center; gap: 8px; }
  #themeToggle {
    display: flex; align-items: center; justify-content: center;
    background: none; border: 1px solid var(--border); border-radius: 20px;
    width: 32px; height: 32px; cursor: pointer; color: var(--text); padding: 0;
  }
  #themeToggle:hover { background: var(--panel); }
  #themeToggle svg { width: 16px; height: 16px; }

  #welcome {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 32px; text-align: center;
  }
  #welcome h1 { font-size: 26px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
  #welcome p { color: var(--muted); font-size: 15px; margin: 0 0 28px; max-width: 420px; line-height: 1.6; }
  #examples {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 480px;
  }
  .example {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 13.5px; cursor: pointer; text-align: start;
    color: var(--text); line-height: 1.4; transition: border-color 0.15s;
  }
  .example:hover { border-color: var(--accent); }

  #chat { flex: 1; overflow-y: auto; padding: 20px; display: none; }
  #chat.active { display: block; }
  #welcome.hidden { display: none; }

  .msg { margin: 10px 0; padding: 10px 14px; border-radius: 14px; max-width: 78%; line-height: 1.6; }
  .msg code { background: rgba(0,0,0,0.08); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  .user { background: var(--accent); color: var(--accent-text); margin-inline-start: auto; }
  .bot { background: var(--panel); border: 1px solid var(--border); margin-inline-end: auto; }

  #inputBar { display: flex; padding: 16px; gap: 10px; border-top: 1px solid var(--border); }
  #inputBox {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 15px; font-family: inherit;
  }
  #inputBox:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    padding: 12px 22px; border: none; border-radius: 10px; background: var(--accent);
    color: var(--accent-text); cursor: pointer; font-size: 15px; font-family: inherit; font-weight: 500;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="wordmark">NetMind</div>
    <div id="headerControls">
      <button id="themeToggle" aria-label="Toggle theme">
        <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="langToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/></svg>
        <span id="langLabel">العربية</span>
      </button>
    </div>
  </div>

  <div id="welcome">
    <h1 id="welcomeTitle">Welcome to NetMind</h1>
    <p id="welcomeSub">Ask about any device on the network — check status, look up an IP, or turn something on or off.</p>
    <div id="examples"></div>
  </div>

  <div id="chat"></div>

  <div id="inputBar">
    <input id="inputBox" type="text" />
    <button id="sendBtn"></button>
  </div>
</div>

<script>
const STRINGS = {
  en: {
    dir: 'ltr', toggleLabel: 'العربية',
    welcomeTitle: 'Welcome to NetMind',
    welcomeSub: "Ask about any device on the network — check status, look up an IP, or turn something on or off.",
    placeholder: 'Ask about any device on the network...',
    send: 'Send',
    error: 'Something went wrong connecting to the server.',
    examples: [
      "What's khalid's IP address?",
      "List all devices",
      "Turn off khalil's network",
      "Is host-ahmed online?"
    ]
  },
  ar: {
    dir: 'rtl', toggleLabel: 'English',
    welcomeTitle: 'مرحبًا بك في نتمايند',
    welcomeSub: 'اسأل عن أي جهاز بالشبكة — تحقق من حالته، اعرف عنوان الـ IP، أو شغّله أو أطفئه.',
    placeholder: 'اسأل عن أي جهاز بالشبكة...',
    send: 'إرسال',
    error: 'صار خطأ بالاتصال بالسيرفر.',
    examples: [
      'وش عنوان IP لخالد؟',
      'اعرض كل الأجهزة',
      'شغّل شبكة خليل',
      'هل host-ahmed شغال؟'
    ]
  }
};

let lang = 'en';
const sessionId = crypto.randomUUID();
const chat = document.getElementById('chat');
const welcome = document.getElementById('welcome');
const input = document.getElementById('inputBox');
const btn = document.getElementById('sendBtn');
const examplesEl = document.getElementById('examples');

function applyLang() {
  const s = STRINGS[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = s.dir;
  document.getElementById('langLabel').textContent = s.toggleLabel;
  document.getElementById('welcomeTitle').textContent = s.welcomeTitle;
  document.getElementById('welcomeSub').textContent = s.welcomeSub;
  input.placeholder = s.placeholder;
  btn.textContent = s.send;
  examplesEl.innerHTML = '';
  s.examples.forEach(text => {
    const div = document.createElement('div');
    div.className = 'example';
    div.textContent = text;
    div.addEventListener('click', () => { input.value = text; send(); });
    examplesEl.appendChild(div);
  });
}

document.getElementById('langToggle').addEventListener('click', () => {
  lang = lang === 'en' ? 'ar' : 'en';
  applyLang();
});

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeIconSun').style.display = theme === 'dark' ? 'block' : 'none';
  document.getElementById('themeIconMoon').style.display = theme === 'dark' ? 'none' : 'block';
  localStorage.setItem('netmind-theme', theme);
}

const savedTheme = localStorage.getItem('netmind-theme');
const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(savedTheme || (systemPrefersDark ? 'dark' : 'light'));

document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function formatMessage(text) {
  let safe = escapeHtml(text);
  safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
  safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/\n/g, '<br>');
  return safe;
}

function addMsg(text, cls, raw) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (raw) { div.innerHTML = formatMessage(text); } else { div.textContent = text; }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send() {
  const message = input.value.trim();
  if (!message) return;

  if (!chat.classList.contains('active')) {
    welcome.classList.add('hidden');
    chat.classList.add('active');
  }

  addMsg(message, 'user');
  input.value = '';
  btn.disabled = true;
  const placeholder = addMsg('...', 'bot');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message })
    });
    const data = await res.json();
    placeholder.innerHTML = formatMessage(data.reply);
  } catch (e) {
    placeholder.textContent = STRINGS[lang].error;
  }
  btn.disabled = false;
}

btn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

applyLang();
</script>
</body>
</html>
